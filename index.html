<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registrar cliente</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f4e79">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="config.js"></script>
<script src="api.js"></script>
<style>
  :root { --azul:#1f4e79; --verde:#1e8e3e; --gris:#f2f4f7; --borde:#d0d5dd; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Roboto,Arial,sans-serif; background:var(--gris); color:#1d2939; }
  header { background:var(--azul); color:#fff; padding:16px; }
  header h1 { margin:0; font-size:20px; }
  header p { margin:4px 0 0; opacity:.85; font-size:14px; }
  form { padding:16px; max-width:560px; margin:auto; }
  .card { background:#fff; border-radius:12px; padding:16px; margin-bottom:14px; box-shadow:0 1px 2px rgba(0,0,0,.06); }
  .card h2 { font-size:15px; margin:0 0 10px; color:var(--azul); }
  label { display:block; font-size:14px; font-weight:600; margin:10px 0 4px; }
  label .req { color:#d92d20; }
  input, select, textarea { width:100%; font-size:16px; padding:12px; border:1px solid var(--borde); border-radius:8px; background:#fff; }
  textarea { min-height:70px; }
  .btn { display:block; width:100%; font-size:17px; font-weight:600; padding:14px; border:0; border-radius:10px; cursor:pointer; }
  .btn-sec { background:#e8eef6; color:var(--azul); }
  .btn-pri { background:var(--verde); color:#fff; font-size:18px; }
  .btn:disabled { opacity:.6; }
  .foto { margin-top:6px; }
  .foto img { width:100%; max-height:220px; object-fit:cover; border-radius:8px; margin-top:8px; display:none; }
  .ok { color:var(--verde); font-weight:600; font-size:14px; margin-top:8px; }
  .err { color:#d92d20; font-size:14px; margin-top:8px; }
  .muted { color:#667085; font-size:13px; }
  #exito { display:none; text-align:center; padding:40px 16px; }
  #exito .icono { font-size:64px; }
</style>
</head>
<body>
<header>
  <h1>Registrar cliente nuevo</h1>
  <p class="empresa"></p>
</header>

<form id="f" autocomplete="off" onsubmit="enviar(event)">
  <div class="card">
    <h2>Vendedor</h2>
    <label>¿Quién registra? <span class="req">*</span></label>
    <input name="vendedor" id="vendedor" required list="listaVendedores" placeholder="Escribe tu nombre">
    <datalist id="listaVendedores">
    </datalist>
  </div>

  <div class="card">
    <h2>Datos del cliente</h2>
    <label>Nombre comercial <span class="req">*</span></label>
    <input name="nombre" required placeholder="Ej: Bodega La Esquina">
    <label>Persona de contacto</label>
    <input name="contacto">
    <label>Teléfono</label>
    <input name="telefono" type="tel" inputmode="tel" placeholder="0414-1234567">
    <label>Correo</label>
    <input name="correo" type="email">
    <label>Dirección</label>
    <textarea name="direccion"></textarea>
    <label>Zona / Ciudad</label>
    <input name="zona">
  </div>

  <div class="card">
    <h2>Fotos</h2>
    <div class="foto">
      <label>Foto del RIF <span class="req">*</span></label>
      <input type="file" accept="image/*" capture="environment" id="fotoRif" onchange="previsualizar(this,'prevRif')">
      <img id="prevRif">
    </div>
    <div class="foto">
      <label>Foto del local <span class="req">*</span></label>
      <input type="file" accept="image/*" capture="environment" id="fotoLocal" onchange="previsualizar(this,'prevLocal')">
      <img id="prevLocal">
    </div>
  </div>

  <div class="card">
    <h2>Ubicación</h2>
    <p class="muted">Párate en el local y toca el botón. Activa el GPS del teléfono.</p>
    <button type="button" class="btn btn-sec" id="btnGps" onclick="tomarUbicacion()">📍 Tomar ubicación actual</button>
    <div id="gpsEstado"></div>
    <label>o pega el enlace de Google Maps</label>
    <input name="mapsLink" placeholder="https://maps.app.goo.gl/...">
  </div>

  <div class="card">
    <h2>Observaciones</h2>
    <textarea name="notas" placeholder="Horario, tipo de negocio, productos de interés..."></textarea>
  </div>

  <button class="btn btn-pri" id="btnEnviar">Enviar registro</button>
  <div id="error" class="err"></div>
  <p class="muted" style="text-align:center">Los campos con <span class="req">*</span> son obligatorios.</p>
</form>

<div id="exito">
  <div class="icono">✅</div>
  <h2>¡Cliente registrado!</h2>
  <p id="exitoDetalle" class="muted"></p>
  <button class="btn btn-pri" onclick="nuevo()" style="max-width:320px;margin:20px auto 0">Registrar otro cliente</button>
</div>

<script>
  var gps = null;

  // Recordar el vendedor en este teléfono
  try {
    var v = localStorage.getItem('vendedor');
    if (v) document.getElementById('vendedor').value = v;
  } catch (e) {}

  function previsualizar(input, idImg) {
    var img = document.getElementById(idImg);
    if (input.files && input.files[0]) {
      img.src = URL.createObjectURL(input.files[0]);
      img.style.display = 'block';
    }
  }

  // Reduce la foto a máx. 1600px y JPEG para que suba rápido con datos móviles
  function comprimir(file) {
    return new Promise(function (resolve, reject) {
      if (!file) return resolve('');
      var img = new Image();
      img.onload = function () {
        var max = 1600, w = img.width, h = img.height;
        if (w > max || h > max) { var k = max / Math.max(w, h); w = Math.round(w * k); h = Math.round(h * k); }
        var c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL('image/jpeg', 0.75));
      };
      img.onerror = function () { reject(new Error('No se pudo leer la foto')); };
      img.src = URL.createObjectURL(file);
    });
  }

  function mostrarGps(est) {
    est.innerHTML = '<div class="ok">✔ Ubicación tomada (precisión ~' + gps.precision + ' m) · <a target="_blank" href="https://www.google.com/maps?q=' + gps.lat + ',' + gps.lng + '">ver en mapa</a></div>';
  }

  function tomarUbicacion() {
    var est = document.getElementById('gpsEstado');
    if (!navigator.geolocation) { est.innerHTML = '<div class="err">Este teléfono no permite GPS aquí. Pega el enlace de Google Maps.</div>'; return; }
    est.innerHTML = '<div class="muted">Buscando ubicación... si el teléfono pregunta, toca <b>Permitir</b>.</div>';
    navigator.geolocation.getCurrentPosition(function (p) {
      gps = { lat: p.coords.latitude.toFixed(6), lng: p.coords.longitude.toFixed(6), precision: Math.round(p.coords.accuracy) };
      mostrarGps(est);
    }, function (e) {
      est.innerHTML = '<div class="err">' + (e.code === 1
        ? 'El permiso de ubicación está bloqueado. Toca el candado 🔒 junto a la dirección → Permisos → Ubicación → Permitir, y vuelve a tocar el botón.'
        : 'No se pudo obtener la ubicación. Revisa que el GPS del teléfono esté encendido y vuelve a intentar.') +
        ' También puedes pegar el enlace de Google Maps.</div>';
    }, { enableHighAccuracy: true, timeout: 25000, maximumAge: 0 });
  }

  async function enviar(ev) {
    ev.preventDefault();
    var f = document.getElementById('f'), err = document.getElementById('error'), btn = document.getElementById('btnEnviar');
    err.textContent = '';
    var fr = document.getElementById('fotoRif').files[0], fl = document.getElementById('fotoLocal').files[0];
    if (!fr || !fl) { err.textContent = 'Falta la foto del RIF o del local.'; return; }
    if (!gps && !f.mapsLink.value.trim()) { err.textContent = 'Falta la ubicación: toca "Tomar ubicación" o pega el enlace de Google Maps.'; return; }

    btn.disabled = true; btn.textContent = 'Enviando... no cierres la app';
    try {
      var d = {};
      new FormData(f).forEach(function (val, k) { d[k] = typeof val === 'string' ? val.trim() : val; });
      if (gps) { d.lat = gps.lat; d.lng = gps.lng; d.precision = gps.precision; }
      d.fotoRif = await comprimir(fr);
      d.fotoLocal = await comprimir(fl);
      try { localStorage.setItem('vendedor', d.vendedor); } catch (e) {}

      google.script.run
        .withSuccessHandler(function (r) {
          document.getElementById('f').style.display = 'none';
          document.getElementById('exito').style.display = 'block';
          document.getElementById('exitoDetalle').textContent = 'Código: ' + r.id +
            (r.duplicado ? ' · Aviso: este teléfono ya estaba registrado, la oficina lo revisará.' : '');
          window.scrollTo(0, 0);
        })
        .withFailureHandler(function (e) {
          err.textContent = 'No se pudo enviar: ' + e.message + '. Revisa tu conexión e inténtalo de nuevo (no se perdió lo que llenaste).';
          btn.disabled = false; btn.textContent = 'Enviar registro';
        })
        .registrarCliente(d);
    } catch (e) {
      err.textContent = e.message;
      btn.disabled = false; btn.textContent = 'Enviar registro';
    }
  }

  function nuevo() {
    var v = document.getElementById('vendedor').value;
    var f = document.getElementById('f');
    f.reset(); document.getElementById('vendedor').value = v;
    ['prevRif', 'prevLocal'].forEach(function (id) { document.getElementById(id).style.display = 'none'; });
    document.getElementById('gpsEstado').innerHTML = '';
    gps = null;
    var btn = document.getElementById('btnEnviar'); btn.disabled = false; btn.textContent = 'Enviar registro';
    f.style.display = 'block'; document.getElementById('exito').style.display = 'none';
    window.scrollTo(0, 0);
  }
</script>
</body>
</html>
