<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel de oficina</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f5f6f8">
<meta name="color-scheme" content="light">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<script src="config.js"></script>
<script src="api.js"></script>
<script src="excel.js"></script>
<script src="reglas.js"></script>
<style>
  /* Lista a la izquierda, ficha del cliente en un panel que se desliza desde la derecha */
  :root {
    --bg: #f5f6f8; --surface: #ffffff; --surface-2: #eef1f5; --ink: #0f1722; --ink-2: #4a5566; --ink-3: #8a94a3; --line: #e2e6ec;
    --accent: #286a4d; --accent-ink: #ffffff; --marca-2: #95cf5f; --accent-soft: #e7f1eb;
    --ok: #3a7f24; --ok-soft: #eaf5df; --warn: #a35c00; --warn-soft: #fdf1df; --bad: #c4321f; --bad-soft: #fcebe8;
    --shadow: 0 1px 2px rgba(15, 23, 34, .04), 0 8px 24px rgba(15, 23, 34, .06);
    --shadow-lg: 0 24px 64px rgba(15, 23, 34, .18);
    --radius: 18px;
    --font: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --ease: cubic-bezier(.2, .8, .2, 1);
    color-scheme: light;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body { font-family: var(--font); background: var(--bg); color: var(--ink); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
  [hidden] { display: none !important; }
  button, input, select, textarea { font-family: inherit; }
  svg { flex-shrink: 0; }
  a { color: var(--accent); font-weight: 600; text-decoration: none; }

  /* Botones */
  .btn { height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
         font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;
         transition: transform .15s var(--ease), background .2s; white-space: nowrap; }
  .btn:hover { background: var(--surface-2); }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn-pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); box-shadow: 0 8px 20px rgba(40, 106, 77, .22); }
  .btn-pri:hover { background: #1f553d; }
  .btn-icono { width: 44px; padding: 0; }
  .btn:focus-visible, .fila:focus-visible, .kpi:focus-visible, .seg button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .gira { animation: gira .8s linear infinite; }
  @keyframes gira { to { transform: rotate(360deg); } }

  /* Logo */
  .logo { height: 36px; width: auto; display: block; flex-shrink: 0; }
  .marca .sep { width: 1px; height: 28px; background: var(--line); flex-shrink: 0; }
  /* Franja con los dos verdes de la marca */
  .franja { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 50; background: linear-gradient(90deg, #286a4d 0 62%, #95cf5f 62% 100%); }

  /* Entrada */
  .entrada { min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; }
  .entrada-caja { width: 100%; max-width: 400px; background: var(--surface); border-radius: 24px; box-shadow: var(--shadow); padding: 32px 28px; animation: sube .5s var(--ease); }
  .entrada-caja .logo-grande { display: block; width: 190px; height: auto; margin: 0 auto 26px; }
  .entrada-caja h1, .entrada-caja > p { text-align: center; }
  .entrada-caja h1 { font-size: 26px; letter-spacing: -.025em; margin: 0; }
  .entrada-caja p { color: var(--ink-2); margin: 6px 0 22px; }
  .entrada-caja .btn { width: 100%; height: 54px; font-size: 16px; margin-top: 18px; border-radius: 14px; }
  .error-txt { color: var(--bad); font-size: 14px; font-weight: 600; margin-top: 12px; min-height: 1em; }
  @keyframes sube { from { transform: translateY(16px); opacity: 0; } }

  /* Campo con etiqueta flotante */
  .campo { position: relative; border: 1.5px solid var(--line); border-radius: 14px; background: var(--surface); transition: border-color .2s; }
  .campo:focus-within { border-color: var(--accent); }
  .campo input, .campo textarea { width: 100%; border: 0; outline: 0; background: transparent; font: 500 16px/1.35 var(--font); color: var(--ink); padding: 26px 16px 10px; resize: vertical; }
  .campo label { position: absolute; left: 16px; top: 17px; color: var(--ink-3); font-weight: 500; pointer-events: none; transition: all .2s var(--ease); }
  .campo input:focus + label, .campo input:not(:placeholder-shown) + label,
  .campo textarea:focus + label, .campo textarea:not(:placeholder-shown) + label { top: 8px; font-size: 12px; font-weight: 600; color: var(--ink-2); }

  /* Estructura */
  .barra { position: sticky; top: 0; z-index: 5; background: rgba(245, 246, 248, .86); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
           border-bottom: 1px solid var(--line); padding: calc(env(safe-area-inset-top, 0px) + 12px) 0 12px; }
  .contenedor { max-width: 1240px; margin: 0 auto; padding: 0 20px; }
  .barra .contenedor { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .marca { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .marca b { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .marca small { color: var(--ink-3); font-size: 12px; font-weight: 500; }
  .acciones { display: flex; gap: 8px; }

  .cabeza { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin: 28px 0 20px; }
  .cabeza h1 { font-size: 30px; letter-spacing: -.03em; margin: 0; line-height: 1.1; }
  .cabeza p { margin: 6px 0 0; color: var(--ink-3); font-size: 14px; font-weight: 500; }

  /* Indicadores */
  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .kpi { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px; border: 1.5px solid transparent; cursor: pointer; text-align: left;
         transition: border-color .2s, transform .15s var(--ease); display: flex; flex-direction: column; gap: 4px; }
  .kpi:hover { transform: translateY(-1px); }
  .kpi.activo { border-color: var(--accent); }
  .kpi span { color: var(--ink-2); font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .kpi b { font-size: 30px; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .punto { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
  .punto.Pendiente { background: var(--warn); } .punto.Aprobado { background: var(--ok); } .punto.Rechazado { background: var(--bad); } .punto.hoy { background: var(--accent); }

  /* Herramientas */
  .herr { display: flex; gap: 10px; flex-wrap: wrap; margin: 20px 0 14px; align-items: center; }
  .buscar { flex: 1 1 280px; position: relative; }
  .buscar svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--ink-3); }
  .buscar input { width: 100%; height: 46px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); padding: 0 14px 0 42px; font: 500 15px var(--font); color: var(--ink); outline: 0; }
  .buscar input:focus { border-color: var(--accent); }
  .seg { display: inline-flex; background: var(--surface-2); border-radius: 14px; padding: 4px; gap: 2px; overflow-x: auto; max-width: 100%; }
  .seg button { height: 38px; padding: 0 14px; border: 0; border-radius: 10px; background: transparent; color: var(--ink-2); font-weight: 600; font-size: 14px; cursor: pointer; white-space: nowrap; }
  .seg button.activo { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(15, 23, 34, .1); }
  .selector { height: 46px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); padding: 0 12px; font: 600 14px var(--font); color: var(--ink); }

  /* Lista */
  .lista { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; margin-bottom: 40px; }
  .lista-cab, .fila { display: grid; grid-template-columns: minmax(0, 2.4fr) minmax(0, 1.2fr) minmax(0, 1.2fr) 130px 120px 24px; gap: 16px; align-items: center; padding: 0 20px; }
  .lista-cab { height: 44px; font-size: 12px; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; border-bottom: 1px solid var(--line); }
  .fila { min-height: 72px; border-bottom: 1px solid var(--line); cursor: pointer; transition: background .15s; }
  .filas.entrar .fila { animation: aparece .35s var(--ease) both; }
  .fila.nueva { animation: resalta 2.4s ease; }
  @keyframes resalta { 0%, 30% { background: #fdf3d6; } }
  .filas.vieja { opacity: .55; pointer-events: none; transition: opacity .2s; }
  .fila:last-child { border-bottom: 0; }
  .fila:hover { background: #f9fafc; }
  .fila.sel { background: var(--accent-soft); }
  @keyframes aparece { from { opacity: 0; transform: translateY(4px); } }
  .cliente { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .avatar { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-weight: 800; font-size: 14px; flex-shrink: 0; }
  .cliente b, .celda b { display: block; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cliente small, .celda small { display: block; color: var(--ink-3); font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .celda { min-width: 0; }
  .alerta { color: var(--bad); font-size: 12px; font-weight: 700; }
  .btn-borrar { display: block; margin: 10px auto 0; background: none; border: 0; color: var(--bad); font-weight: 700; font-size: 14px; padding: 6px 10px; border-radius: 8px; cursor: pointer; }
  .btn-borrar:hover { background: var(--bad-soft); }
  .btn-borrar:disabled { opacity: .5; cursor: default; }
  /* Recomendación automática según el manual de crédito (reglas.js) */
  .sug { display: inline-flex; align-items: center; gap: 5px; margin-top: 6px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; }
  .sug.aprobar { background: var(--ok-soft); color: var(--ok); }
  .sug.revisar { background: var(--warn-soft); color: var(--warn); }
  .reco { overflow: hidden; }
  .reco-cab { padding: 16px 18px; display: flex; gap: 12px; align-items: flex-start; }
  .reco-cab .ico { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0; font-weight: 800; }
  .reco.aprobar .reco-cab { background: var(--ok-soft); } .reco.aprobar .ico { background: var(--ok); color: #fff; }
  .reco.revisar .reco-cab { background: var(--warn-soft); } .reco.revisar .ico { background: var(--warn); color: #fff; }
  .reco-cab b { display: block; font-size: 16px; letter-spacing: -.01em; }
  .reco.aprobar .reco-cab b { color: var(--ok); } .reco.revisar .reco-cab b { color: var(--warn); }
  .reco-cab small { display: block; color: var(--ink-2); font-size: 13px; margin-top: 2px; }
  .reco-num { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
  .reco-num div { padding: 12px 18px; border-right: 1px solid var(--line); min-width: 0; }
  .reco-num div:last-child { border-right: 0; }
  .reco-num span, .reco-bloque > span { display: block; font-size: 12px; font-weight: 600; color: var(--ink-3); margin-bottom: 2px; }
  .reco-num b { font-size: 15px; overflow-wrap: anywhere; }
  .reco-bloque { padding: 12px 18px; border-bottom: 1px solid var(--line); }
  .reco-bloque:last-child { border-bottom: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .chips i { font-style: normal; font-size: 12.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--ok-soft); color: var(--ok); }
  .chips.no i { background: var(--bad-soft); color: var(--bad); }
  .reco-lista { margin: 4px 0 0; padding-left: 18px; font-size: 13.5px; color: var(--ink-2); }
  .reco-lista li + li { margin-top: 3px; }
  .reco-lista.ojo { color: var(--warn); font-weight: 600; }
  .reco-pie { padding: 12px 18px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .reco-pie .btn { height: 40px; }
  .reco-pie small { color: var(--ink-3); font-size: 12px; }
  @media (max-width: 520px) { .reco-num { grid-template-columns: 1fr 1fr; } .reco-num div:nth-child(2) { border-right: 0; } .reco-num div:last-child { grid-column: 1 / -1; border-top: 1px solid var(--line); } }
  .pill { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: 999px; font-size: 13px; font-weight: 700; white-space: nowrap; }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pill.Pendiente { background: var(--warn-soft); color: var(--warn); }
  .pill.Aprobado { background: var(--ok-soft); color: var(--ok); }
  .pill.Rechazado { background: var(--bad-soft); color: var(--bad); }
  .chev { color: var(--ink-3); }
  .vacio { padding: 56px 20px; text-align: center; color: var(--ink-2); }
  .vacio b { display: block; font-size: 17px; color: var(--ink); margin-bottom: 4px; }

  /* Panel de detalle */
  .velo { position: fixed; inset: 0; background: rgba(10, 14, 20, .32); z-index: 10; animation: fundido .25s ease; }
  .panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(600px, 100%); background: var(--bg); z-index: 11; box-shadow: var(--shadow-lg);
           display: flex; flex-direction: column; animation: desliza .38s var(--ease); }
  @keyframes fundido { from { opacity: 0; } }
  @keyframes desliza { from { transform: translateX(40px); opacity: 0; } }
  .panel-cab { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: calc(env(safe-area-inset-top, 0px) + 20px) 24px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .panel-cab h2 { margin: 0; font-size: 22px; letter-spacing: -.02em; line-height: 1.2; overflow-wrap: anywhere; }
  .panel-cab small { display: block; color: var(--ink-3); font-weight: 500; margin-top: 4px; }
  .panel-cuerpo { flex: 1; overflow-y: auto; padding: 20px 24px 28px; }
  .seccion { font-size: 12px; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: .08em; margin: 24px 2px 10px; }
  .seccion:first-child { margin-top: 0; }
  .tarjeta { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); }
  .fotos { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .foto { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .foto-marco { aspect-ratio: 4 / 3; background: var(--surface-2); display: grid; place-items: center; text-align: center; color: var(--ink-3); font-size: 13px; font-weight: 500; padding: 10px; position: relative; }
  .foto-marco img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; cursor: zoom-in; animation: fundido .3s ease; }
  .foto-pie { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; font-size: 13px; font-weight: 700; }
  .cargando { width: 26px; height: 26px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: gira .8s linear infinite; margin: 0 auto 8px; }
  .datos { display: grid; grid-template-columns: 1fr 1fr; }
  .dato { padding: 14px 18px; border-bottom: 1px solid var(--line); min-width: 0; }
  .dato:nth-child(odd) { border-right: 1px solid var(--line); }
  .dato.ancho { grid-column: 1 / -1; border-right: 0; }
  .dato span { display: block; font-size: 12px; font-weight: 600; color: var(--ink-3); margin-bottom: 2px; }
  .dato b { font-weight: 600; overflow-wrap: anywhere; }
  .datos .dato:nth-last-child(-n+1) { border-bottom: 0; }
  .mapa { height: 230px; border-radius: var(--radius) var(--radius) 0 0; overflow: hidden; background: var(--surface-2); }
  .mapa iframe { width: 100%; height: 100%; border: 0; }
  .mapa-pie { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 16px; font-size: 14px; }
  .mapa-pie span { color: var(--ink-2); font-weight: 500; }
  .estados { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .estados button { height: 48px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 700; font-size: 14px; color: var(--ink-2); cursor: pointer; transition: all .2s; }
  .estados button.Aprobado.activo { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); }
  .estados button.Pendiente.activo { border-color: var(--warn); background: var(--warn-soft); color: var(--warn); }
  .estados button.Rechazado.activo { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); }
  .panel-pie { padding: 14px 24px calc(env(safe-area-inset-bottom, 0px) + 14px); background: var(--surface); border-top: 1px solid var(--line); display: flex; gap: 10px; }
  .panel-pie .btn { flex: 1; height: 50px; font-size: 15px; border-radius: 14px; }

  /* Visor de fotos */
  .visor { position: fixed; inset: 0; z-index: 30; background: rgba(8, 10, 14, .92); display: flex; align-items: center; justify-content: center; padding: 16px; cursor: zoom-out; animation: fundido .2s ease; }
  .visor img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; }

  .toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); transform: translateX(-50%); z-index: 40; background: var(--ink); color: #fff;
           padding: 12px 18px; border-radius: 14px; font-size: 14px; font-weight: 600; box-shadow: var(--shadow-lg); max-width: calc(100% - 32px); width: max-content; text-align: center; animation: sube .3s var(--ease); }

  /* Las dos líneas de BIPA */
  :root { --ritual: linear-gradient(120deg, #f6dc7e 0%, #f2948a 52%, #9d97dc 100%); --productos: linear-gradient(120deg, #286a4d 0%, #4f9a55 55%, #95cf5f 100%); }
  .lineas { display: inline-flex; background: var(--surface); border-radius: 14px; padding: 4px; gap: 4px; box-shadow: var(--shadow); }
  .lineas button { height: 38px; padding: 0 16px; border: 0; border-radius: 10px; background: transparent; color: var(--ink-2); font: inherit; font-weight: 700; font-size: 14px; cursor: pointer; white-space: nowrap; transition: background .2s, color .2s; }
  .lineas button.activo { background: var(--ink); color: #fff; }
  .lineas button.l-ritual.activo { background: var(--ritual); color: #2b2233; }
  .lineas button.l-productos.activo { background: var(--productos); color: #fff; }
  .tag-linea { display: inline-block; vertical-align: 1px; margin-right: 6px; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: .01em; }
  .tag-linea.ritual { background: var(--ritual); color: #2b2233; }
  .tag-linea.productos { background: var(--productos); color: #fff; }

  /* Datos fiscales leídos de la foto */
  .fiscal-pie { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 18px; border-top: 1px solid var(--line); font-size: 13px; color: var(--ink-3); font-weight: 500; }
  .fiscal-pie button { border: 0; background: var(--accent-soft); color: var(--accent); font: inherit; font-weight: 700; font-size: 13px; height: 34px; padding: 0 14px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
  .fiscal-pie button:disabled { opacity: .6; cursor: default; }

  .datos.dos .dato { border-bottom: 0; }
  @media (max-width: 520px) { .datos.dos .dato:first-child { border-bottom: 1px solid var(--line); } }

  /* Ventana de exportar */
  .dialogo { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(460px, calc(100% - 32px)); background: var(--surface); border-radius: 22px;
             box-shadow: var(--shadow-lg); padding: 26px; z-index: 11; animation: fundido .2s ease; }
  .dialogo h2 { margin: 0; font-size: 21px; letter-spacing: -.02em; }
  .dialogo > p { margin: 6px 0 18px; color: var(--ink-2); font-size: 14px; }
  .exp-opciones { display: grid; gap: 10px; }
  .exp-op { display: grid; grid-template-columns: auto 1fr; grid-template-areas: "n t" "n s"; column-gap: 14px; align-items: center; text-align: left; padding: 14px 16px;
            border: 1.5px solid var(--line); border-radius: 16px; background: var(--surface); font: inherit; color: var(--ink); cursor: pointer; transition: border-color .2s, background .2s; }
  .exp-op:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
  .exp-op:disabled { opacity: .5; cursor: default; }
  .exp-op b { grid-area: n; font-size: 26px; font-weight: 800; min-width: 44px; height: 44px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; padding: 0 8px; }
  .exp-op span { grid-area: t; font-weight: 700; font-size: 15px; }
  .exp-op small { grid-area: s; color: var(--ink-3); font-size: 13px; font-weight: 500; }

  @media (max-width: 900px) {
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .lista-cab { display: none; }
    .fila { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "cli est" "sub fec"; row-gap: 6px; column-gap: 10px; padding: 14px 16px; }
    .fila .c-cli { grid-area: cli; } .fila .c-est { grid-area: est; justify-self: end; }
    .fila .c-zona, .fila .chev { display: none; }
    .fila .c-ven { grid-area: sub; padding-left: 52px; min-width: 0; }
    .fila .c-ven b { font-size: 13px; font-weight: 600; color: var(--ink-2); }
    .fila .c-fec { grid-area: fec; justify-self: end; }
    .fila .c-fec small { font-size: 12px; }
    .seg { display: flex; width: 100%; }
    .lineas { display: flex; width: 100%; }
    .lineas button { flex: 1; padding: 0 6px; font-size: 13px; }
    .seg button { flex: 1; padding: 0 6px; font-size: 13px; }
    .acciones .txt { display: none; }
    .acciones .btn { width: 44px; padding: 0; }
    .contenedor { padding: 0 16px; }
    .cabeza h1 { font-size: 26px; }
  }
  @media (max-width: 520px) {
    .cliente b { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .datos { grid-template-columns: 1fr; }
    .fotos { gap: 10px; }
    .dato:nth-child(odd) { border-right: 0; }
    .panel-cab, .panel-cuerpo { padding-left: 16px; padding-right: 16px; }
    .panel-pie { padding-left: 16px; padding-right: 16px; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="franja" aria-hidden="true"></div>

<!-- Entrada -->
<div class="entrada" id="login">
  <div class="entrada-caja">
    <img class="logo-grande" src="logo-bipa-completo.png" alt="BIPA · Buenas ideas puestas en acción" width="190" height="116">
    <h1>Panel de oficina</h1>
    <p><span class="empresa">Productos BIPA</span> · Clientes nuevos</p>
    <div class="campo"><input type="password" id="clave" placeholder=" " autocomplete="current-password"><label for="clave">Clave de oficina</label></div>
    <button class="btn btn-pri" id="btnEntrar" type="button">Entrar</button>
    <div class="error-txt" id="loginErr"></div>
  </div>
</div>

<!-- Aplicación -->
<div id="app" hidden>
  <header class="barra">
    <div class="contenedor">
      <div class="marca">
        <img class="logo" src="logo-bipa.png" alt="BIPA" width="54" height="36"><span class="sep"></span>
        <div style="min-width:0"><b>Panel de oficina</b><small class="empresa">Productos BIPA</small></div>
      </div>
      <div class="acciones">
        <button class="btn" id="btnActualizar" type="button" title="Actualizar">
          <svg id="icoAct" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></svg><span class="txt">Actualizar</span>
        </button>
        <button class="btn" id="btnExportar" type="button" title="Exportar a Excel">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5"/><path d="M5 19h14"/></svg><span class="txt">Exportar</span>
        </button>
        <button class="btn" id="btnHoja" type="button" title="Abrir en Google Sheets">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2.5"/><path d="M4 9h16M4 15h16M10 9v12"/></svg><span class="txt">Google Sheets</span>
        </button>
        <button class="btn btn-icono" id="btnSalir" type="button" title="Salir" aria-label="Salir">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 17l-5-5 5-5M5 12h11"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="contenedor">
    <div class="cabeza">
      <div><h1>Clientes nuevos</h1><p id="actualizado">Cargando…</p></div>
      <div class="lineas" id="segLinea" role="tablist" aria-label="Línea">
        <button type="button" data-l="" class="activo">Todas</button>
        <button type="button" data-l="BIPA Ritual Sensorial" class="l-ritual">Ritual Sensorial</button>
        <button type="button" data-l="BIPA Productos" class="l-productos">Productos</button>
      </div>
    </div>

    <div class="kpis" id="kpis"></div>

    <div class="herr">
      <div class="buscar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="buscar" type="search" placeholder="Buscar cliente, vendedor, zona, tipo…">
      </div>
      <div class="seg" id="segEstado">
        <button type="button" data-e="" class="activo">Todos</button>
        <button type="button" data-e="Pendiente">Pendientes</button>
        <button type="button" data-e="Aprobado">Aprobados</button>
        <button type="button" data-e="Rechazado">Rechazados</button>
      </div>
      <select class="selector" id="filtroVendedor" aria-label="Vendedor"><option value="">Todos los vendedores</option></select>
    </div>

    <div class="lista">
      <div class="lista-cab"><div>Cliente</div><div>Vendedor</div><div>Zona</div><div>Fecha</div><div>Estado</div><div></div></div>
      <div id="filas"></div>
    </div>
  </main>
</div>

<!-- Ficha del cliente -->
<div id="ficha" hidden>
  <div class="velo" id="velo"></div>
  <aside class="panel" role="dialog" aria-labelledby="fNombre">
    <div class="panel-cab">
      <div style="min-width:0"><h2 id="fNombre"></h2><small id="fSub"></small></div>
      <button class="btn btn-icono" id="btnCerrar" type="button" aria-label="Cerrar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="panel-cuerpo" id="fCuerpo"></div>
    <div class="panel-pie">
      <button class="btn btn-pri" id="btnGuardar" type="button">Guardar revisión</button>
      <button class="btn-borrar" id="btnEliminar" type="button">Eliminar registro</button>
    </div>
  </aside>
</div>

<!-- Exportar al sistema administrativo -->
<div id="exportar" hidden>
  <div class="velo" id="veloExp"></div>
  <div class="dialogo" role="dialog" aria-labelledby="expTit">
    <h2 id="expTit">Exportar clientes aprobados</h2>
    <p>Archivo de Excel listo para importar en tu sistema administrativo (Profit, Saint u otro).</p>
    <div class="exp-opciones">
      <button class="exp-op" id="expNuevos" type="button"><b id="expNuevosN">0</b><span>Nuevos</span><small>Aprobados que aún no se han exportado. Quedan marcados como exportados.</small></button>
      <button class="exp-op" id="expTodos" type="button"><b id="expTodosN">0</b><span>Todos los aprobados</span><small>Incluye los que ya se exportaron antes.</small></button>
    </div>
    <button class="btn" id="expCerrar" type="button" style="width:100%;margin-top:14px">Cancelar</button>
  </div>
</div>

<div class="visor" id="visor" hidden><img id="visorImg" alt="Foto ampliada"></div>

<script>
  var GEN = 0, FIRMA = '', VISTOS = null, ANIMAR = true;
  var CLAVE = '', DATOS = [], FILTRO = { estado: '', vendedor: '', q: '', linea: '' }, ACTUAL = null, ESTADO_SEL = '', refresco = null, ULTIMA = null;
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function toast(msg) { var t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(function () { t.remove(); }, 2600); }

  var COLORES = [['#e7f1eb', '#286a4d'], ['#e3f4ec', '#12805c'], ['#fdf1df', '#a35c00'], ['#f1e9fb', '#6b3fb8'], ['#e4f3f6', '#126b80'], ['#fbe9ef', '#b0325a']];
  function avatar(nombre) {
    var t = String(nombre || '?').trim(), h = 0; for (var i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) >>> 0;
    var c = COLORES[h % COLORES.length];
    var ini = t.split(/\s+/).filter(Boolean).slice(0, 2).map(function (p) { return p[0]; }).join('').toUpperCase() || '?';
    return '<div class="avatar" style="background:' + c[0] + ';color:' + c[1] + '">' + esc(ini) + '</div>';
  }

  /* ---------- Entrada y caché ---------- */
  async function huella(c) {
    try {
      var h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('registro-clientes:' + c));
      return Array.from(new Uint8Array(h)).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
    } catch (e) { return null; }
  }
  function leerCache() { try { return JSON.parse(localStorage.getItem('oficina-cache') || 'null'); } catch (e) { return null; } }
  function guardarCache(d) { huella(CLAVE).then(function (h) { try { if (h) localStorage.setItem('oficina-cache', JSON.stringify({ h: h, d: d })); } catch (e) {} }); }

  function mostrarApp() {
    $('login').hidden = true; $('app').hidden = false;
    if (!refresco) refresco = setInterval(function () { if (!document.hidden) cargar(true); }, 60000);
  }
  function actualizando(si) {
    $('btnActualizar').disabled = si;
    $('icoAct').classList.toggle('gira', si);
    if (si) $('actualizado').textContent = 'Actualizando…';
    else pintarHora();
  }
  function pintarHora() {
    if (!ULTIMA) return;
    $('actualizado').textContent = 'Actualizado a las ' + ULTIMA.toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' }) + ' · se actualiza solo cada minuto';
  }

  async function entrar(guardada) {
    CLAVE = guardada || $('clave').value;
    if (!CLAVE) { $('loginErr').textContent = 'Escribe la clave.'; return; }
    var btn = $('btnEntrar'); $('loginErr').textContent = '';
    var cache = leerCache(), h = await huella(CLAVE), rapido = !!(cache && h && cache.h === h);
    var g = ++GEN;
    if (rapido) { mostrarApp(); recibir(cache.d); $('filas').classList.add('vieja'); actualizando(true); $('actualizado').textContent = 'Mostrando la última lista guardada · buscando lo nuevo…'; }
    else { btn.disabled = true; btn.innerHTML = '<svg class="gira" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.2-8.6"/></svg> Entrando'; }
    google.script.run.withSuccessHandler(function (d) {
      try { sessionStorage.setItem('clave', CLAVE); } catch (e) {}
      btn.disabled = false; btn.textContent = 'Entrar';
      if (g !== GEN) return;
      ULTIMA = new Date(); mostrarApp(); recibir(d); guardarCache(d); actualizando(false);
    }).withFailureHandler(function (e) {
      $('filas').classList.remove('vieja');
      actualizando(false); btn.disabled = false; btn.textContent = 'Entrar';
      if (rapido && e.message !== 'Clave incorrecta') { toast('Sin conexión: mostrando la última lista guardada'); return; }
      try { sessionStorage.removeItem('clave'); localStorage.removeItem('oficina-cache'); } catch (x) {}
      $('app').hidden = true; $('login').hidden = false; $('loginErr').textContent = e.message;
    }).listarClientes(CLAVE);
  }
  $('btnEntrar').onclick = function () { entrar(); };
  $('clave').addEventListener('keydown', function (e) { if (e.key === 'Enter') entrar(); });
  $('btnSalir').onclick = function () {
    try { sessionStorage.removeItem('clave'); } catch (e) {}
    clearInterval(refresco); refresco = null; CLAVE = ''; $('clave').value = '';
    $('app').hidden = true; $('login').hidden = false;
  };

  // Cada carga lleva un número. Si mientras tanto empezó otra carga o se guardó/eliminó algo,
  // la respuesta vieja se descarta: así nunca reaparecen registros borrados ni estados anteriores.
  function cargar(silencioso) {
    if (!CLAVE) return;
    var g = ++GEN;
    actualizando(true);
    google.script.run
      .withSuccessHandler(function (d) { if (g !== GEN) return; ULTIMA = new Date(); recibir(d); guardarCache(d); actualizando(false); })
      .withFailureHandler(function (e) { if (g !== GEN) return; actualizando(false); if (!silencioso) toast('No se pudo actualizar: ' + e.message); })
      .listarClientes(CLAVE);
  }
  function cambio() { GEN++; actualizando(false); } // se llama al guardar o eliminar
  // Solo se actualiza sola si la pestaña está a la vista
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && CLAVE && !$('app').hidden && (!ULTIMA || Date.now() - ULTIMA > 30000)) cargar(true);
  });
  $('btnActualizar').onclick = function () { cargar(false); };
  $('btnHoja').onclick = function () {
    var w = window.open('', '_blank');
    google.script.run.withSuccessHandler(function (u) { if (w) w.location = u; else location.href = u; })
      .withFailureHandler(function (e) { if (w) w.close(); toast(e.message); }).urlHoja(CLAVE);
  };

  /* ---------- Lista ---------- */
  function clave(x) { return x['ID'] || 'f' + x.fila; }
  function recibir(d, forzar) {
    $('filas').classList.remove('vieja');
    var firma = JSON.stringify(d || []);
    if (!forzar && firma === FIRMA) return; // nada cambió: no se toca la pantalla
    FIRMA = firma;
    DATOS = d || [];
    var sel = $('filtroVendedor'), actual = sel.value;
    var vend = Array.from(new Set(enLinea().map(function (x) { return x['Vendedor']; }).filter(Boolean))).sort();
    sel.innerHTML = '<option value="">Todos los vendedores</option>' + vend.map(function (v) { return '<option>' + esc(v) + '</option>'; }).join('');
    sel.value = actual;
    pintar();
    if (ACTUAL) {
      var x = buscarFila(ACTUAL);
      if (x) pintarCabecera(x); else { cerrar(); toast('Ese cliente ya no está en la lista (otra persona lo eliminó).'); }
    }
    VISTOS = {}; DATOS.forEach(function (x) { VISTOS[clave(x)] = 1; });
  }
  // Si el motor de Apps Script es viejo, la línea, el tipo y el interés llegan dentro de Observaciones
  function deObs(x, k) { var m = String(x['Observaciones'] || '').match(new RegExp(k + ': ([^·]+)')); return m ? m[1].trim() : ''; }
  function lineaDe(x) { return x['Línea'] || deObs(x, 'Línea') || 'BIPA Productos'; } // los registros viejos son de Productos
  function etiquetaLinea(x) { var r = lineaDe(x) === 'BIPA Ritual Sensorial'; return '<span class="tag-linea ' + (r ? 'ritual' : 'productos') + '">' + (r ? 'Ritual' : 'Productos') + '</span>'; }
  function enLinea() { return DATOS.filter(function (x) { return !FILTRO.linea || lineaDe(x) === FILTRO.linea; }); }
  function buscarFila(k) { return DATOS.filter(function (r) { return clave(r) === k; })[0]; }

  function chipSugerencia(x) {
    var s = recomendar(x, lineaDe(x));
    return '<div><span class="sug ' + s.accion + '">' + (s.accion === 'aprobar' ? '✓ Sugerido: aprobar · ' + esc(s.corto) : '⚠ ' + esc(s.titulo)) + '</span></div>';
  }
  function tarjetaRecomendacion(x) {
    var s = recomendar(x, lineaDe(x)), g = s.reglas;
    var h = '<div class="tarjeta reco ' + s.accion + '"><div class="reco-cab"><div class="ico">' + (s.accion === 'aprobar' ? '✓' : '!') + '</div>' +
      '<div><b>' + esc(s.titulo) + '</b><small>' + esc(s.motivo) + '</small></div></div>';
    if (g) {
      h += '<div class="reco-num"><div><span>Crédito inicial</span><b>$' + g.creditoInicial + '</b></div><div><span>Límite máximo</span><b>$' + String(g.creditoMax).replace(/\B(?=(\d{3})+(?!\d))/g, '.') + (g === REGLAS.canales.moderno ? '+' : '') + '</b></div>' +
        '<div><span>Plazo</span><b>' + esc(g.plazo) + '</b></div></div>' +
        '<div class="reco-bloque"><span>Canal</span><b>' + esc(g.nombre) + '</b></div>' +
        '<div class="reco-bloque"><span>' + (g.soloEstos ? 'Solo puede comprar' : 'Puede comprar') + '</span><div class="chips">' + g.permitido.map(function (p) { return '<i>' + esc(p) + '</i>'; }).join('') + '</div></div>' +
        '<div class="reco-bloque"><span>No vender</span><div class="chips no">' + g.excluido.map(function (p) { return '<i>' + esc(p) + '</i>'; }).join('') + '</div></div>';
    }
    if (s.alertas.length) h += '<div class="reco-bloque"><span>Revisar primero</span><ul class="reco-lista ojo">' + s.alertas.map(function (a) { return '<li>' + esc(a) + '</li>'; }).join('') + '</ul></div>';
    if (s.pendientes.length) h += '<div class="reco-bloque"><span>Pendientes</span><ul class="reco-lista">' + s.pendientes.map(function (a) { return '<li>' + esc(a) + '</li>'; }).join('') + '</ul></div>';
    if (g) h += '<div class="reco-bloque"><span>Al facturar cada pedido</span><ul class="reco-lista">' + REGLAS.alFacturar.map(function (a) { return '<li>' + esc(a) + '</li>'; }).join('') + '</ul></div>';
    if (g && s.accion === 'aprobar' && x['Estado'] !== 'Aprobado') h += '<div class="reco-pie"><button type="button" class="btn btn-pri" id="btnAplicar">Aprobar con esta recomendación</button><small>Marca Aprobado y anota el crédito en la nota interna. Luego toca Guardar.</small></div>';
    return h + '</div>';
  }
  function pintar() {
    var BASE = enLinea();
    var hoy = new Date().toDateString(), c = { total: BASE.length, Pendiente: 0, Aprobado: 0, hoy: 0 };
    BASE.forEach(function (x) { if (c[x['Estado']] !== undefined) c[x['Estado']]++; if (x.fechaISO && new Date(x.fechaISO).toDateString() === hoy) c.hoy++; });
    var kp = [['', 'Total registrados', c.total, ''], ['Pendiente', 'Por revisar', c.Pendiente, 'Pendiente'], ['Aprobado', 'Aprobados', c.Aprobado, 'Aprobado'], ['hoy', 'Registrados hoy', c.hoy, 'hoy']];
    $('kpis').innerHTML = kp.map(function (k) {
      var act = k[0] !== 'hoy' && FILTRO.estado === k[0] && (k[0] !== '' || true);
      return '<button type="button" class="kpi' + (k[0] !== 'hoy' && FILTRO.estado === k[0] ? ' activo' : '') + '" data-k="' + k[0] + '"><span><i class="punto ' + k[3] + '"></i>' + k[1] + '</span><b>' + k[2] + '</b></button>';
    }).join('');
    document.querySelectorAll('.kpi').forEach(function (b) { b.onclick = function () { if (b.dataset.k !== 'hoy') ponerEstado(b.dataset.k); }; });

    var q = FILTRO.q.toLowerCase();
    var lista = BASE.filter(function (x) {
      return (!FILTRO.estado || x['Estado'] === FILTRO.estado) && (!FILTRO.vendedor || x['Vendedor'] === FILTRO.vendedor) &&
        (!q || [x['Nombre comercial'], x['Razón social'], x['RIF'], x['Vendedor'], x['Zona / Ciudad'], x['Persona de contacto'], x['Teléfono'], x['Tipo de cliente'], x['Interés'], lineaDe(x)].join(' ').toLowerCase().indexOf(q) >= 0);
    });
    var cont = $('filas');
    cont.classList.toggle('entrar', ANIMAR); ANIMAR = false;
    var y = window.scrollY;
    cont.innerHTML = lista.length ? lista.map(function (x, i) {
      var sub = [x['Tipo de cliente'] || deObs(x, 'Tipo'), x['Persona de contacto']].filter(Boolean).join(' · ') || x['Teléfono'] || '';
      var k = clave(x), nueva = VISTOS && !VISTOS[k];
      return '<div class="fila' + (ACTUAL === k ? ' sel' : '') + (nueva ? ' nueva' : '') + '" tabindex="0" role="button" data-f="' + esc(k) + '" style="animation-delay:' + Math.min(i, 12) * 25 + 'ms">' +
        '<div class="cliente c-cli">' + avatar(x['Nombre comercial']) + '<div style="min-width:0"><b>' + esc(x['Nombre comercial'] || 'Sin nombre') + '</b><small>' + etiquetaLinea(x) + esc(sub) + '</small>' +
          (x['Nota oficina'] && /^OJO/.test(x['Nota oficina']) ? '<div class="alerta">' + esc(x['Nota oficina']) + '</div>' : '') +
          (x['Estado'] === 'Pendiente' || !x['Estado'] ? chipSugerencia(x) : '') + '</div></div>' +
        '<div class="celda c-ven"><b>' + esc(x['Vendedor']) + '</b></div>' +
        '<div class="celda c-zona"><small>' + esc(x['Zona / Ciudad'] || '—') + '</small></div>' +
        '<div class="celda c-fec"><small>' + esc(x['Fecha']) + '</small></div>' +
        '<div class="c-est"><span class="pill ' + esc(x['Estado']) + '">' + esc(x['Estado']) + '</span></div>' +
        '<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>' +
      '</div>';
    }).join('') : '<div class="vacio"><b>' + (BASE.length ? 'Nada coincide con el filtro' : 'Todavía no hay clientes') + '</b>' +
      (BASE.length ? 'Prueba con otra búsqueda o quita los filtros.' : 'Cuando un vendedor registre uno, aparece aquí solo.') + '</div>';
    document.querySelectorAll('.fila').forEach(function (r) {
      r.onclick = function () { abrir(r.dataset.f); };
      r.onkeydown = function (e) { if (e.key === 'Enter') abrir(r.dataset.f); };
    });
    if (window.scrollY !== y) window.scrollTo(0, y);
  }
  function ponerEstado(e) {
    FILTRO.estado = e;
    document.querySelectorAll('#segEstado button').forEach(function (b) { b.classList.toggle('activo', b.dataset.e === e); });
    pintar();
  }
  document.querySelectorAll('#segEstado button').forEach(function (b) { b.onclick = function () { ponerEstado(b.dataset.e); }; });
  function ponerLinea(l) {
    FILTRO.linea = l; FILTRO.vendedor = '';
    try { localStorage.setItem('oficina-linea', l); } catch (e) {}
    document.querySelectorAll('#segLinea button').forEach(function (b) { b.classList.toggle('activo', b.dataset.l === l); });
    recibir(DATOS, true);
  }
  document.querySelectorAll('#segLinea button').forEach(function (b) { b.onclick = function () { ponerLinea(b.dataset.l); }; });
  try { var lg = localStorage.getItem('oficina-linea'); if (lg) { FILTRO.linea = lg; document.querySelectorAll('#segLinea button').forEach(function (b) { b.classList.toggle('activo', b.dataset.l === lg); }); } } catch (e) {}
  $('buscar').addEventListener('input', function () { FILTRO.q = this.value; pintar(); });
  $('filtroVendedor').onchange = function () { FILTRO.vendedor = this.value; pintar(); };

  /* ---------- Ficha ---------- */
  function pintarCabecera(x) {
    $('fNombre').textContent = x['Nombre comercial'] || 'Sin nombre';
    $('fSub').innerHTML = etiquetaLinea(x) + 'Registrado por ' + esc(x['Vendedor'] || '—') + ' · ' + esc(x['Fecha'] || '');
  }
  function abrir(k) {
    var x = buscarFila(k); if (!x) return;
    ACTUAL = k; ESTADO_SEL = x['Estado'] || 'Pendiente';
    pintarCabecera(x);
    var mm = String(x['Google Maps'] || '').match(/q=(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/);
    function foto(id, titulo, url) {
      return '<div class="foto"><div class="foto-marco" id="' + id + '">' + (url ? '<div><div class="cargando"></div>Cargando foto…</div>' : 'Sin foto') + '</div>' +
        '<div class="foto-pie"><span>' + titulo + '</span>' + (url ? '<a target="_blank" rel="noopener" href="' + esc(url) + '">Abrir ↗</a>' : '') + '</div></div>';
    }
    function dato(k, etiqueta, ancho) {
      var v = x[k] || (k === 'Tipo de cliente' ? deObs(x, 'Tipo') : k === 'Interés' ? deObs(x, 'Interés') : '');
      return '<div class="dato' + (ancho ? ' ancho' : '') + '"><span>' + (etiqueta || k) + '</span><b>' + (esc(v) || '—') + '</b></div>';
    }
    var tel = String(x['Teléfono'] || '').replace(/[^\d+]/g, '');
    $('fCuerpo').innerHTML =
      '<div class="seccion">Qué hacer con este cliente</div>' + tarjetaRecomendacion(x) +
      '<div class="seccion">Fotos</div><div class="fotos">' + foto('imgRif', 'RIF', x['Foto RIF']) + foto('imgLocal', 'Local', x['Foto local']) + '</div>' +
      '<div class="seccion">Cliente</div><div class="tarjeta datos">' +
        dato('Tipo de cliente') + dato('Interés') + dato('Persona de contacto', 'Contacto') +
        '<div class="dato"><span>Teléfono</span><b>' + (tel ? '<a href="tel:' + esc(tel) + '">' + esc(x['Teléfono']) + '</a>' : '—') + '</b></div>' +
        dato('Correo') + dato('Zona / Ciudad', 'Zona') + dato('Dirección', null, true) + dato('Observaciones', null, true) +
      '</div>' +
      '<div class="seccion">Datos fiscales</div><div class="tarjeta"><div class="datos dos">' +
        dato('RIF') + dato('Razón social') +
      '</div>' + (x['Foto RIF'] ? '<div class="fiscal-pie"><span id="fiscalTxt">' + (x['RIF'] ? 'Leído de la foto del RIF' : 'Aún no se ha leído de la foto') + '</span>' +
        '<button type="button" id="btnLeerRif">' + (x['RIF'] ? 'Volver a leer' : 'Leer de la foto') + '</button></div>' : '') + '</div>' +
      '<div class="seccion">Ubicación</div><div class="tarjeta">' +
        (mm ? '<div class="mapa"><iframe loading="lazy" title="Mapa" src="https://maps.google.com/maps?q=' + mm[1] + ',' + mm[2] + '&z=17&output=embed"></iframe></div>' : '') +
        '<div class="mapa-pie"><span>' + (x['Precisión GPS (m)'] ? 'Precisión ±' + esc(x['Precisión GPS (m)']) + ' m' : (x['Google Maps'] ? 'Enlace de Google Maps' : 'Sin ubicación')) + '</span>' +
        (x['Google Maps'] ? '<a target="_blank" rel="noopener" href="' + esc(x['Google Maps']) + '">Cómo llegar →</a>' : '') + '</div></div>' +
      '<div class="seccion">Revisión de oficina</div>' +
      '<div class="estados">' + ['Aprobado', 'Pendiente', 'Rechazado'].map(function (e) { return '<button type="button" class="' + e + (ESTADO_SEL === e ? ' activo' : '') + '" data-e="' + e + '">' + e + '</button>'; }).join('') + '</div>' +
      '<div class="campo" style="margin-top:12px"><textarea id="nota" rows="3" placeholder=" ">' + esc(x['Nota oficina']) + '</textarea><label for="nota">Nota interna</label></div>' +
      '<div class="dato ancho" style="padding:14px 2px 0;border:0"><span>Código</span><b>' + esc(x['ID']) + '</b></div>';
    document.querySelectorAll('.estados button').forEach(function (b) {
      b.onclick = function () { ESTADO_SEL = b.dataset.e; document.querySelectorAll('.estados button').forEach(function (o) { o.classList.toggle('activo', o === b); }); };
    });
    $('ficha').hidden = false; document.body.style.overflow = 'hidden'; $('fCuerpo').scrollTop = 0;
    document.querySelectorAll('.fila').forEach(function (r) { r.classList.toggle('sel', r.dataset.f === k); });
    if ($('btnAplicar')) $('btnAplicar').onclick = function () {
      var s = recomendar(x, lineaDe(x));
      ESTADO_SEL = 'Aprobado';
      document.querySelectorAll('.estados button').forEach(function (o) { o.classList.toggle('activo', o.dataset.e === 'Aprobado'); });
      var n = $('nota'); if (n.value.indexOf(s.nota) < 0) n.value = [s.nota, n.value].filter(Boolean).join('\n');
      $('btnGuardar').scrollIntoView({ block: 'nearest', behavior: 'smooth' }); $('btnGuardar').focus();
      toast('Listo: toca Guardar revisión');
    };
    if (x['Foto RIF']) cargarFoto('imgRif', x['Foto RIF']);
    if ($('btnLeerRif')) $('btnLeerRif').onclick = function () { leerRif(x); };
    if (x['Foto local']) cargarFoto('imgLocal', x['Foto local']);
  }
  function cerrar() {
    $('ficha').hidden = true; document.body.style.overflow = ''; ACTUAL = null;
    document.querySelectorAll('.fila.sel').forEach(function (r) { r.classList.remove('sel'); });
  }
  $('btnCerrar').onclick = cerrar; $('velo').onclick = cerrar;
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { if (!$('visor').hidden) $('visor').hidden = true; else if (!$('exportar').hidden) $('exportar').hidden = true; else if (!$('ficha').hidden) cerrar(); } });

  var FOTOS = {};
  function cargarFoto(id, url) {
    function poner(src) {
      var m = $(id); if (!m) return; m.innerHTML = '';
      var img = document.createElement('img'); img.src = src; img.alt = 'Foto';
      img.onclick = function () { $('visorImg').src = src; $('visor').hidden = false; };
      m.appendChild(img);
    }
    if (FOTOS[url]) return poner(FOTOS[url]);
    google.script.run
      .withSuccessHandler(function (src) { FOTOS[url] = src; poner(src); })
      .withFailureHandler(function (e) {
        var m = $(id); if (!m) return;
        m.innerHTML = '<div>No se pudo cargar (' + esc(e.message) + ')<br><a href="#" id="re' + id + '">Reintentar</a></div>';
        $('re' + id).onclick = function (ev) { ev.preventDefault(); m.innerHTML = '<div><div class="cargando"></div>Cargando foto…</div>'; cargarFoto(id, url); };
      })
      .verFoto(CLAVE, url);
  }
  $('visor').onclick = function () { $('visor').hidden = true; };

  /* ---------- Leer RIF de la foto ---------- */
  function leerRif(x) {
    var b = $('btnLeerRif'); b.disabled = true; b.textContent = 'Leyendo…'; $('fiscalTxt').textContent = 'Leyendo la foto, unos segundos…';
    google.script.run
      .withSuccessHandler(function (r) {
        x['RIF'] = r.rif || x['RIF']; x['Razón social'] = r.razon || x['Razón social'];
        if (ACTUAL === clave(x)) { var y = $('fCuerpo').scrollTop; abrir(clave(x)); $('fCuerpo').scrollTop = y; }
        toast(r.rif ? 'RIF leído: ' + r.rif : 'No se encontró un RIF en la foto');
      })
      .withFailureHandler(function (e) {
        if (!$('btnLeerRif')) return;
        $('btnLeerRif').disabled = false; $('btnLeerRif').textContent = 'Reintentar';
        $('fiscalTxt').textContent = /Acción no válida/.test(e.message) ? 'Falta actualizar el código en Apps Script' : 'No se pudo leer: ' + e.message;
      })
      .leerRif(CLAVE, x.fila, x['ID']);
  }

  /* ---------- Exportar a Excel ---------- */
  var COLS_EXP = [['ID', 'Código'], ['Línea', 'Línea'], ['RIF', 'RIF'], ['Razón social', 'Razón social'], ['Nombre comercial', 'Nombre comercial'], ['Persona de contacto', 'Persona de contacto'],
    ['Teléfono', 'Teléfono'], ['Correo', 'Correo'], ['Dirección', 'Dirección'], ['Zona / Ciudad', 'Zona / Ciudad'], ['Tipo de cliente', 'Tipo de cliente'], ['Interés', 'Interés'],
    ['Vendedor', 'Vendedor'], ['Fecha', 'Fecha de registro'], ['Latitud', 'Latitud'], ['Longitud', 'Longitud'], ['Google Maps', 'Google Maps'], ['Observaciones', 'Observaciones'], ['Nota oficina', 'Nota oficina']];
  function aprobados(soloNuevos) { return enLinea().filter(function (x) { return x['Estado'] === 'Aprobado' && (!soloNuevos || !x['Exportado']); }).reverse(); }
  $('btnExportar').onclick = function () {
    var n = aprobados(true).length, t = aprobados(false).length;
    $('expNuevosN').textContent = n; $('expTodosN').textContent = t;
    $('expNuevos').disabled = !n; $('expTodos').disabled = !t;
    $('expTit').textContent = 'Exportar aprobados' + (FILTRO.linea ? ' · ' + FILTRO.linea.replace('BIPA ', '') : '');
    $('exportar').hidden = false;
  };
  $('expCerrar').onclick = $('veloExp').onclick = function () { $('exportar').hidden = true; };
  function exportar(soloNuevos) {
    var lista = aprobados(soloNuevos); if (!lista.length) return;
    var CREDITO = ['Canal', 'Crédito inicial (USD)', 'Límite máximo (USD)', 'Plazo', 'Portafolio permitido', 'No vender'];
    var filas = [COLS_EXP.map(function (c) { return c[1]; }).concat(CREDITO)].concat(lista.map(function (x) {
      var g = recomendar(x, lineaDe(x)).reglas;
      return COLS_EXP.map(function (c) { return c[0] === 'Línea' ? lineaDe(x) : x[c[0]] || ''; })
        .concat(g ? [g.nombre, g.creditoInicial, g.creditoMax, g.plazo, g.permitido.join(', '), g.excluido.join(', ')] : ['Sin reglas', '', '', '', '', '']);
    }));
    var hoy = new Date(), p = function (n) { return String(n).padStart(2, '0'); };
    Excel.descargar(Excel.crear(filas, 'Clientes'), 'clientes-' + (FILTRO.linea === 'BIPA Ritual Sensorial' ? 'ritual-' : FILTRO.linea ? 'productos-' : '') + (soloNuevos ? 'nuevos' : 'aprobados') + '-' + hoy.getFullYear() + '-' + p(hoy.getMonth() + 1) + '-' + p(hoy.getDate()) + '.xlsx');
    $('exportar').hidden = true;
    if (!soloNuevos) { toast('Descargado: ' + lista.length + ' clientes'); return; }
    var nums = lista.map(function (x) { return x.fila; }), ids = lista.map(function (x) { return x['ID']; });
    cambio();
    var marca = new Date().toISOString();
    lista.forEach(function (x) { x['Exportado'] = marca; });
    google.script.run
      .withSuccessHandler(function () { guardarCache(DATOS); toast('Descargado y marcado: ' + lista.length + ' clientes'); cargar(true); })
      .withFailureHandler(function (e) {
        cargar(true);
        lista.forEach(function (x) { x['Exportado'] = ''; });
        toast(/Acción no válida/.test(e.message) ? 'Descargado. Para marcarlos como exportados falta actualizar el código en Apps Script.' : 'Descargado, pero no se pudo marcar: ' + e.message);
      })
      .marcarExportados(CLAVE, nums, ids);
  }
  $('expNuevos').onclick = function () { exportar(true); };
  $('expTodos').onclick = function () { exportar(false); };

  $('btnGuardar').onclick = function () {
    var x0 = buscarFila(ACTUAL); if (!x0) return;
    var k = ACTUAL, e = ESTADO_SEL, nota = $('nota').value, btn = this;
    btn.disabled = true; btn.textContent = 'Guardando…'; cambio();
    google.script.run
      .withSuccessHandler(function () {
        btn.disabled = false; btn.textContent = 'Guardar revisión';
        var x = buscarFila(k); if (x) { x['Estado'] = e; x['Nota oficina'] = nota; }
        FIRMA = ''; guardarCache(DATOS); pintar(); cerrar(); toast('Guardado: ' + e); cargar(true);
      })
      .withFailureHandler(function (err) { btn.disabled = false; btn.textContent = 'Guardar revisión'; toast('No se pudo guardar: ' + err.message); cargar(true); })
      .cambiarEstado(CLAVE, x0.fila, e, nota, x0['ID']);
  };

  $('btnEliminar').onclick = function () {
    var x = buscarFila(ACTUAL); if (!x) return;
    if (!confirm('¿Eliminar a "' + (x['Nombre comercial'] || 'este cliente') + '"?\n\nSe borra de la hoja y sus fotos van a la papelera de Drive. Esto no se puede deshacer desde el panel.')) return;
    var btn = this; btn.disabled = true; btn.textContent = 'Eliminando…'; cambio();
    google.script.run
      .withSuccessHandler(function () {
        btn.disabled = false; btn.textContent = 'Eliminar registro';
        var resto = DATOS.filter(function (r) { return clave(r) !== clave(x); });
        guardarCache(resto); cerrar(); recibir(resto); toast('Eliminado: ' + (x['Nombre comercial'] || 'registro')); cargar(true);
      })
      .withFailureHandler(function (e) {
        btn.disabled = false; btn.textContent = 'Eliminar registro'; cargar(true);
        toast(/Acción no válida/.test(e.message) ? 'Para eliminar falta actualizar el código en Apps Script (Nueva versión).' : 'No se pudo eliminar: ' + e.message);
      })
      .eliminarCliente(CLAVE, x.fila, x['ID']);
  };

  try { CLAVE = sessionStorage.getItem('clave') || ''; } catch (e) {}
  if (CLAVE) entrar(CLAVE);
</script>
</body>
</html>
